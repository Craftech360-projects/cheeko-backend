<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1320" viewBox="0 0 960 1320" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Cheeko SD content encryption, version 1: upload, the shared wrap secret, key delivery, offline playback, dashboard preview, key locations</title>
<desc id="dsc">Six sections. 1: the server seals each uploaded file with AES-128-CTR under a per-pack key K before S3. 2: one 32-byte wrap secret exists twice, as a firmware build constant and as CONTENT_WRAP_SECRET in the server environment; the two must match byte for byte. 3: on a card tap the gateway asks manager-api, which wraps K under a key derived from the shared secret and returns it with the URLs; no MAC is consulted, and the toy downloads ciphertext to SD. 4: playback is offline, the toy unwraps K in RAM and decrypts per chunk. 5: the dashboard previews through an admin-only decrypt proxy. 6: a table of where each secret lives.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:15px;font-weight:600;fill:#2C2C2A}
.t{font-size:13px;font-weight:600}
.s{font-size:11.5px}
.n{font-size:11.5px;fill:#5F5E5A}
.m{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:11px}
.srv rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}
.srv .t{fill:#26215C}.srv .s{fill:#3C3489}
.toy rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}
.toy .t{fill:#04342C}.toy .s{fill:#085041}
.sto rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.sto .t{fill:#2C2C2A}.sto .s{fill:#444441}
.key rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:1}
.key .t{fill:#412402}.key .s{fill:#633806}
.sec{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 3}
.arr{fill:none;stroke:#5F5E5A;stroke-width:1.2;marker-end:url(#a)}
.seg{fill:#FFFFFF;stroke:#5F5E5A;stroke-width:1}
.segc{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.tbl{font-size:11.5px;fill:#2C2C2A}
.tblh{font-size:12px;font-weight:600;fill:#2C2C2A}
</style>
</defs>
<rect width="960" height="1320" fill="#FFFFFF"/>

<g class="srv"><rect x="560" y="10" width="12" height="12" rx="2"/></g><text class="n" x="577" y="20">server</text>
<g class="toy"><rect x="630" y="10" width="12" height="12" rx="2"/></g><text class="n" x="647" y="20">toy</text>
<g class="sto"><rect x="690" y="10" width="12" height="12" rx="2"/></g><text class="n" x="707" y="20">storage</text>
<g class="key"><rect x="765" y="10" width="12" height="12" rx="2"/></g><text class="n" x="782" y="20">keys and crypto</text>

<rect class="sec" x="30" y="30" width="900" height="250" rx="6"/>
<text class="h" x="44" y="52">1. Upload: the server seals every file with the pack's own key before it reaches S3</text>
<g class="srv"><rect x="50" y="80" width="170" height="60" rx="4"/><text class="t" x="135" y="100" text-anchor="middle">Admin dashboard</text><text class="s" x="135" y="116" text-anchor="middle">picks an mp3 or png</text><text class="s" x="135" y="130" text-anchor="middle">sends packCode along</text></g>
<g class="srv"><rect x="270" y="80" width="220" height="60" rx="4"/><text class="t" x="380" y="100" text-anchor="middle">manager-api upload route</text><text class="s" x="380" y="116" text-anchor="middle">png → LVGL .bin for item art</text><text class="s" x="380" y="130" text-anchor="middle">seal(buffer, K) in memory</text></g>
<g class="sto"><rect x="540" y="80" width="170" height="60" rx="4"/><text class="t" x="625" y="100" text-anchor="middle">S3 + CloudFront</text><text class="s" x="625" y="116" text-anchor="middle">sealed bytes only</text><text class="s" x="625" y="130" text-anchor="middle">same paths, public URL</text></g>
<g class="sto"><rect x="760" y="80" width="150" height="60" rx="4"/><text class="t" x="835" y="100" text-anchor="middle">content_item row</text><text class="s" x="835" y="116" text-anchor="middle">audio_url, image_url</text><text class="s" x="835" y="130" text-anchor="middle">shape unchanged</text></g>
<line class="arr" x1="220" y1="110" x2="262" y2="110"/>
<line class="arr" x1="490" y1="110" x2="532" y2="110"/>
<line class="arr" x1="710" y1="110" x2="752" y2="110"/>
<g class="key"><rect x="50" y="170" width="170" height="60" rx="4"/><text class="t" x="135" y="190" text-anchor="middle">Pack key K (16 bytes)</text><text class="s" x="135" y="206" text-anchor="middle">random, per pack, first upload</text><text class="s" x="135" y="220" text-anchor="middle">stored in DB, encrypted at rest</text></g>
<path class="arr" d="M220 200 L300 200 L300 148"/>
<text class="n" x="320" y="186">Sealed file layout (byte offsets below the bar)</text>
<rect class="seg" x="320" y="196" width="70" height="30"/><text class="m" x="355" y="215" text-anchor="middle" fill="#2C2C2A">"CKE1"</text>
<rect class="seg" x="390" y="196" width="45" height="30"/><text class="m" x="412" y="215" text-anchor="middle" fill="#2C2C2A">ver=1</text>
<rect class="seg" x="435" y="196" width="55" height="30"/><text class="m" x="462" y="215" text-anchor="middle" fill="#2C2C2A">zero</text>
<rect class="seg" x="490" y="196" width="130" height="30"/><text class="m" x="555" y="215" text-anchor="middle" fill="#2C2C2A">nonce (8, random)</text>
<rect class="segc" x="620" y="196" width="290" height="30"/><text class="m" x="765" y="215" text-anchor="middle" fill="#2C2C2A">AES-128-CTR(K, nonce‖ctr) XOR file</text>
<text class="n" x="320" y="242">0</text><text class="n" x="390" y="242">4</text><text class="n" x="435" y="242">5</text><text class="n" x="490" y="242">8</text><text class="n" x="620" y="242">16</text><text class="n" x="910" y="242" text-anchor="end">size + 16</text>
<text class="n" x="50" y="262">counter block = nonce ‖ 64-bit big-endian counter from 0, +1 per 16-byte block. No padding. Files without the magic are legacy plaintext.</text>

<rect class="sec" x="30" y="300" width="900" height="130" rx="6"/>
<text class="h" x="44" y="322">2. The wrap secret: 32 bytes, one for the whole fleet, generated once</text>
<g class="key"><rect x="50" y="350" width="230" height="60" rx="4"/><text class="t" x="165" y="370" text-anchor="middle">Wrap secret (32 bytes)</text><text class="s" x="165" y="386" text-anchor="middle">generated once, never rotated</text><text class="s" x="165" y="400" text-anchor="middle">kept where the master key is kept</text></g>
<g class="toy"><rect x="330" y="350" width="230" height="60" rx="4"/><text class="t" x="445" y="370" text-anchor="middle">Firmware build constant</text><text class="m" x="445" y="387" text-anchor="middle" fill="#085041">CONFIG_CHEEKO_CONTENT_WRAP_SECRET_HEX</text><text class="s" x="445" y="401" text-anchor="middle">no registration, no first contact</text></g>
<g class="srv"><rect x="610" y="350" width="230" height="60" rx="4"/><text class="t" x="725" y="370" text-anchor="middle">Server environment</text><text class="m" x="725" y="387" text-anchor="middle" fill="#3C3489">CONTENT_WRAP_SECRET</text><text class="s" x="725" y="401" text-anchor="middle">64 hex chars, same 32 bytes</text></g>
<line class="arr" x1="280" y1="374" x2="322" y2="374"/>
<line class="arr" x1="280" y1="392" x2="602" y2="392"/>
<text class="n" x="50" y="424">Byte-identical or nothing plays. CTR has no integrity check, so a mismatch is silent: both sides assert the same test vectors instead.</text>

<rect class="sec" x="30" y="450" width="900" height="220" rx="6"/>
<text class="h" x="44" y="472">3. Card tap: lookup, wrapped key delivery, download to SD</text>
<g class="toy"><rect x="50" y="500" width="170" height="60" rx="4"/><text class="t" x="135" y="520" text-anchor="middle">Cheeko toy</text><text class="s" x="135" y="536" text-anchor="middle">card_lookup over MQTT</text><text class="s" x="135" y="550" text-anchor="middle">rfid_uid, mac, local_version</text></g>
<g class="srv"><rect x="270" y="500" width="220" height="60" rx="4"/><text class="t" x="380" y="520" text-anchor="middle">mqtt-gateway</text><text class="s" x="380" y="536" text-anchor="middle">POST card/tap, GET card/lookup</text><text class="s" x="380" y="550" text-anchor="middle">whitelist must pass encryption{}</text></g>
<g class="srv"><rect x="540" y="500" width="220" height="60" rx="4"/><text class="t" x="650" y="520" text-anchor="middle">manager-api lookup</text><text class="s" x="650" y="536" text-anchor="middle">loads K for the pack, no mac needed</text><text class="s" x="650" y="550" text-anchor="middle">returns URLs + encryption{}</text></g>
<g class="sto"><rect x="810" y="500" width="100" height="60" rx="4"/><text class="t" x="860" y="520" text-anchor="middle">Database</text><text class="s" x="860" y="536" text-anchor="middle">K per pack</text><text class="s" x="860" y="550" text-anchor="middle">sealed at rest</text></g>
<line class="arr" x1="220" y1="518" x2="262" y2="518"/>
<line class="arr" x1="270" y1="542" x2="228" y2="542"/>
<line class="arr" x1="490" y1="518" x2="532" y2="518"/>
<line class="arr" x1="540" y1="542" x2="498" y2="542"/>
<line class="arr" x1="760" y1="530" x2="802" y2="530"/>
<line class="arr" x1="135" y1="560" x2="135" y2="582"/>
<g class="toy"><rect x="50" y="590" width="440" height="60" rx="4"/><text class="t" x="270" y="610" text-anchor="middle">Download to SD, after card_content arrives</text><text class="s" x="270" y="626" text-anchor="middle">GET each URL from CloudFront → /sdcard/cheeko/skills/&lt;id&gt;/audio/01.mp3</text><text class="s" x="270" y="640" text-anchor="middle">manifest.jsn keeps wrapped K + nonce_w. Plain K is never on SD.</text></g>
<g class="key"><rect x="540" y="590" width="370" height="60" rx="4"/><text class="t" x="725" y="610" text-anchor="middle">Wrap, per tap. Unknown toys included.</text><text class="m" x="725" y="627" text-anchor="middle" fill="#412402">wrap_key = HMAC-SHA256(secret, "cheeko-wrap-v1")[0:16]</text><text class="m" x="725" y="642" text-anchor="middle" fill="#412402">wrapped = AES-128-CTR(wrap_key, nonce_w, K)</text></g>

<rect class="sec" x="30" y="690" width="900" height="200" rx="6"/>
<text class="h" x="44" y="712">4. Playback: fully offline</text>
<g class="sto"><rect x="50" y="740" width="190" height="60" rx="4"/><text class="t" x="145" y="760" text-anchor="middle">SD card</text><text class="s" x="145" y="776" text-anchor="middle">audio/01.mp3 (sealed)</text><text class="s" x="145" y="790" text-anchor="middle">manifest.jsn (wrapped K)</text></g>
<g class="key"><rect x="290" y="740" width="250" height="60" rx="4"/><text class="t" x="415" y="760" text-anchor="middle">Unwrap K in RAM</text><text class="s" x="415" y="776" text-anchor="middle">secret from firmware → same HMAC</text><text class="s" x="415" y="790" text-anchor="middle">K = AES-CTR(wrap_key, nonce_w, wrapped)</text></g>
<g class="toy"><rect x="590" y="740" width="190" height="60" rx="4"/><text class="t" x="685" y="760" text-anchor="middle">Decrypt in place</text><text class="s" x="685" y="776" text-anchor="middle">mbedtls_aes_crypt_ctr</text><text class="s" x="685" y="790" text-anchor="middle">per 2 KB fread chunk</text></g>
<g class="toy"><rect x="820" y="740" width="90" height="60" rx="4"/><text class="t" x="865" y="760" text-anchor="middle">Play</text><text class="s" x="865" y="776" text-anchor="middle">MP3 decoder</text><text class="s" x="865" y="790" text-anchor="middle">LVGL image</text></g>
<line class="arr" x1="240" y1="770" x2="282" y2="770"/>
<line class="arr" x1="540" y1="770" x2="582" y2="770"/>
<line class="arr" x1="780" y1="770" x2="812" y2="770"/>
<text class="n" x="50" y="832">No network needed: the sealed files and wrapped key are on SD, the secret is in firmware. Plain K exists in RAM only while a pack is playing.</text>
<text class="n" x="50" y="850">No CKE1 magic → legacy plaintext file, read exactly as today. Bad or missing key → refuse playback and log it, never play ciphertext.</text>
<text class="n" x="50" y="868">The secret never changes, so there is no rotation recovery: no fingerprint file, no re-registration, no wipe. Changing it means re-encrypting everything plus an OTA.</text>

<rect class="sec" x="30" y="910" width="900" height="200" rx="6"/>
<text class="h" x="44" y="932">5. Dashboard preview: admin-only decrypt proxy, key never leaves the server</text>
<g class="srv"><rect x="50" y="960" width="200" height="60" rx="4"/><text class="t" x="150" y="980" text-anchor="middle">Admin browser</text><text class="s" x="150" y="996" text-anchor="middle">fetch preview?url&amp;packCode</text><text class="s" x="150" y="1010" text-anchor="middle">Bearer token → blob → &lt;audio&gt;</text></g>
<g class="srv"><rect x="300" y="960" width="260" height="60" rx="4"/><text class="t" x="430" y="980" text-anchor="middle">manager-api preview route</text><text class="s" x="430" y="996" text-anchor="middle">origin check → read 16-byte header</text><text class="s" x="430" y="1010" text-anchor="middle">K for packCode → stream decipher</text></g>
<g class="sto"><rect x="610" y="960" width="170" height="60" rx="4"/><text class="t" x="695" y="980" text-anchor="middle">CloudFront</text><text class="s" x="695" y="996" text-anchor="middle">sealed file</text><text class="s" x="695" y="1010" text-anchor="middle">fetched by the server</text></g>
<line class="arr" x1="250" y1="978" x2="292" y2="978"/>
<line class="arr" x1="300" y1="1002" x2="258" y2="1002"/>
<line class="arr" x1="560" y1="978" x2="602" y2="978"/>
<line class="arr" x1="610" y1="1002" x2="568" y2="1002"/>
<text class="n" x="50" y="1052">No magic header → 302 redirect to CloudFront, so legacy packs preview as before. Thumbnails are never sealed, so cover art &lt;img&gt; is unchanged.</text>
<text class="n" x="50" y="1070">Item images are LVGL .bin and were never previewable. The proxy only accepts URLs on the CloudFront domain, so it cannot be used as an open proxy.</text>
<text class="n" x="50" y="1088">new Audio(url) cannot send a header, so the dialog fetches with the bearer token and plays a blob URL, revoked when the dialog closes.</text>

<rect class="sec" x="30" y="1130" width="900" height="170" rx="6"/>
<text class="h" x="44" y="1152">6. Where each secret lives</text>
<text class="tblh" x="50" y="1180">Place</text><text class="tblh" x="300" y="1180">Holds</text><text class="tblh" x="640" y="1180">If copied alone</text>
<line x1="50" y1="1188" x2="910" y2="1188" stroke="#B4B2A9" stroke-width="1"/>
<text class="tbl" x="50" y="1208">Firmware image</text><text class="tbl" x="300" y="1208">the wrap secret, 32 bytes, build constant</text><text class="tbl" x="640" y="1208">every pack: the accepted v1 trade</text>
<text class="tbl" x="50" y="1228">NVS flash, on the chip</text><text class="tbl" x="300" y="1228">nothing (v2 would put a per-device S here)</text><text class="tbl" x="640" y="1228">nothing</text>
<text class="tbl" x="50" y="1248">SD card</text><text class="tbl" x="300" y="1248">ciphertext + wrapped K in manifest.jsn</text><text class="tbl" x="640" y="1248">nothing playable</text>
<text class="tbl" x="50" y="1268">Database</text><text class="tbl" x="300" y="1268">K per pack, encrypted under the server master key</text><text class="tbl" x="640" y="1268">nothing without the master key</text>
<text class="tbl" x="50" y="1288">On the network</text><text class="tbl" x="300" y="1288">wrapped K + nonce_w, in the lookup reply</text><text class="tbl" x="640" y="1288">useless without the wrap secret</text>
</svg>
