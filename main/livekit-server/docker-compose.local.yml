services:
  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    restart: unless-stopped
    ports:
      - "7880:7880"      # HTTP/WebSocket
      - "7881:7881"      # RTC TCP
      - "7882:7882/udp"  # RTC UDP (single-port mux)
    environment:
      LIVEKIT_KEYS: "devkey: secret123456789012345678901234567890"
      # ponytail: single UDP mux instead of a 50000-50200 range — Windows/Hyper-V
      # reserves random ports in that range on every boot. Restore the range if
      # you ever hit mux throughput limits (hundreds of concurrent participants).
      LIVEKIT_CONFIG: |
        rtc:
          udp_port: 7882
          use_external_ip: false
    command: --dev --bind 0.0.0.0
